<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 다듬는 동안 검색엔진에 노출하지 않음. 정식 공개 때 이 줄과 robots.txt를 지운다. -->
  <meta name="robots" content="noindex, nofollow">
  <title>오킴스 IP &amp; Business Consulting</title>
  <meta name="description" content="깊이 있는 기술 이해와 지식재산 전략으로 기업의 다음 성장을 함께 설계합니다. 특허법인 오킴스 IP·기술사업화 컨설팅.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>

  <header class="site-header">
    <div class="container header-top">
      <p class="journal">IP &amp; Business<br>Consulting Journal</p>
      <a class="brand" href="#" aria-label="오킴스 IP &amp; Company 홈">
        <img src="assets/logo.png" alt="OhKims IP &amp; Company" width="200" height="72">
      </a>
      <div class="header-actions">
        <button class="icon-btn" type="button" aria-label="검색">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <a class="btn-outline" href="#contact">상담 문의 <span class="arrow" aria-hidden="true"></span></a>
        <button class="icon-btn menu-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="gnb">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="container">
      <nav class="gnb" id="gnb" aria-label="주요 메뉴"></nav>
    </div>
  </header>

  <main id="main">
    <section class="container hero" id="hero"></section>
    <section class="container perspective" id="perspective"></section>
    <section class="expertise-wrap" id="expertise"><div class="container expertise"></div></section>
    <section class="container partner" id="about"></section>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
